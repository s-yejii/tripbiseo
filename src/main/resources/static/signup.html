<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원가입</title>
</head>
<body>
    <h2>회원가입</h2>
    <form method="post" action="/signup">
        <p>아이디 <input type="text" name="username" required></p>
        <p>비밀번호 <input type="password" name="password" required></p>
        <p>닉네임 <input type="text" name="nickname"></p>
        <button type="submit">가입하기</button>
    </form>
        <p id="msg" style="color:red"></p>
    <script>
        if (new URLSearchParams(location.search).get("error") === "duplicate") {
            document.getElementById("msg").textContent = "이미 사용 중인 아이디입니다.";
        }
    </script>
</body>
</html>
