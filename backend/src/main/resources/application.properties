spring.application.name=tripbiseo

# 내 PC 값(키·DB 비밀번호)은 application-local.properties에 넣습니다. 파일이 없어도 서버는 켜집니다.
# 견본: application-local.properties.example (복사해서 이름을 바꾸고 값을 채우기)
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tripbiseo
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis: SQL은 resources/mapper/{기능}/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/*.xml

# 로그인 세션 쿠키
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax

# Gemini (Spring AI). 키가 없어도 서버는 켜지고, AI 기능만 규칙 기반 기본값으로 동작합니다.
# Spring AI는 키가 비어 있으면 서버 시작을 막아서, 없을 때는 가짜 글자 no-key를 넘깁니다.
# 진짜 키가 있는지는 AiServiceImpl이 GEMINI_API_KEY로 따로 확인하고, 없으면 Gemini를 부르지 않습니다.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:no-key}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.3
# 다시 시도·예비 모델은 AiServiceImpl이 직접 함 (Spring AI 자체 재시도는 끔)
spring.ai.retry.max-attempts=1

# 외부 API 키 (KAKAO_JS_KEY, KAKAO_REST_API_KEY, TMAP_APP_KEY, ODSAY_API_KEY, TOUR_API_KEY, KMA_SERVICE_KEY)는
# 여기에 적지 않습니다. 각 외부 API 클래스가 @Value("${TMAP_APP_KEY:}")처럼 환경변수나 local 파일에서 바로 읽습니다.
# (여기에 TMAP_APP_KEY=${TMAP_APP_KEY:}처럼 쓰면 자기 자신을 가리켜서 오류가 납니다)

# 메일 (① 회원가입·계정 찾기 인증번호). Gmail SMTP + 앱 비밀번호(16자).
# 값은 application-local.properties의 MAIL_USERNAME·MAIL_PASSWORD (비우면 메일 기능만 503으로 안내)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# 파일 올리기 (③ 예약 캡처 사진): 5MB까지
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
